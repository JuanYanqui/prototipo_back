# ---------- Servidor Backend ----------
server.port=8090
server.error.include-message=always

# ---------- Base de Datos PostgreSQL ----------
# Cada integrante puede usar su propia clave sin tocar este archivo:
#   variables de entorno DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nova_app}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.hikari.maximum-pool-size=10

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.sql.init.mode=always

# Login con perfiles (desactivar solo en pruebas automaticas)
comercialnova.auth.enabled=true
