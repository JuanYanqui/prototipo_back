# --- Servidor ---
server.port=8090

# --- Base de datos PostgreSQL (por defecto) ---
# Se puede cambiar sin tocar el codigo con variables de entorno:
#   DB_URL, DB_USER, DB_PASSWORD
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/comercialnova}
spring.datasource.username=${DB_USER:nova_app}
spring.datasource.password=${DB_PASSWORD:nova123}
spring.datasource.hikari.maximum-pool-size=10

# --- Esquema ---
# Las tablas se crean con src/main/resources/schema.sql (IF NOT EXISTS),
# asi el diseno de datos queda explicito y versionado.
# Hibernate solo VALIDA que las entidades coincidan con las tablas.
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# Mensajes de error claros en la API
server.error.include-message=always
