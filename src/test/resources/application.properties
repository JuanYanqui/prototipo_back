# Por defecto las pruebas usan H2 en memoria (rapidas, no necesitan servidor).
# Para correrlas contra PostgreSQL real:  mvn test -Dspring.profiles.active=pgtest
spring.datasource.url=jdbc:h2:mem:pruebas;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1;LOCK_TIMEOUT=10000
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.hikari.maximum-pool-size=25
spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
